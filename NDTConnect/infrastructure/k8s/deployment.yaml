apiVersion: apps/v1
kind: Deployment
metadata:
  name: ndtconnect-web
  labels:
    app: ndtconnect
    component: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ndtconnect
      component: web
  template:
    metadata:
      labels:
        app: ndtconnect
        component: web
    spec:
      containers:
        - name: web
          image: ndtconnect/web:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: ndtconnect-config
            - secretRef:
                name: ndtconnect-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ndtconnect-web
spec:
  selector:
    app: ndtconnect
    component: web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ndtconnect-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
    - hosts:
        - ndtconnect.com
        - www.ndtconnect.com
      secretName: ndtconnect-tls
  rules:
    - host: ndtconnect.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ndtconnect-web
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ndtconnect-web-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ndtconnect-web
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ndtconnect-config
data:
  NODE_ENV: "production"
  NEXT_PUBLIC_API_URL: "https://ndtconnect.com/api"
  NEXT_PUBLIC_WS_URL: "wss://ndtconnect.com/ws"
