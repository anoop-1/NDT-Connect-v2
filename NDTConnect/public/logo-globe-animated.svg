<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 380 120"
     width="380" height="120"
     role="img"
     aria-label="NDT Connect — rotating globe">
  <defs>
    <!-- 3D-sphere shading: brighter top-left, darker bottom-right -->
    <radialGradient id="sphereLight" cx="38%" cy="35%" r="65%">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>

    <!-- Edge fade so longitudes look softer near the rim -->
    <radialGradient id="edgeFade" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="80%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.4"/>
    </radialGradient>

    <mask id="rimMask">
      <circle cx="60" cy="60" r="44" fill="url(#edgeFade)"/>
    </mask>

    <clipPath id="sphereClip">
      <circle cx="60" cy="60" r="44"/>
    </clipPath>
  </defs>

  <!-- ============== ROTATING SPHERE ============== -->
  <g>
    <!-- Outer rim (static — sphere outline) -->
    <circle cx="60" cy="60" r="44"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="2.5"/>

    <!-- 3D shading -->
    <circle cx="60" cy="60" r="44" fill="url(#sphereLight)"/>

    <!-- Static latitudes — these don't move during Y-axis rotation -->
    <g fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.7" clip-path="url(#sphereClip)" mask="url(#rimMask)">
      <!-- equator -->
      <line x1="16" y1="60" x2="104" y2="60"/>
      <!-- tropics & polar circles, modeled as compressed ellipses -->
      <ellipse cx="60" cy="60" rx="44" ry="14"/>
      <ellipse cx="60" cy="60" rx="44" ry="28"/>
      <ellipse cx="60" cy="60" rx="44" ry="38"/>
    </g>

    <!-- Rotating longitudes —
         Each longitude is a great circle on the sphere passing through both poles.
         Projected to 2D, it's a vertical ellipse with cx=60, ry=44, and rx that
         varies as R * sin(currentAzimuth). The longitude is on the FRONT
         hemisphere when 0 < currentAzimuth < 180, and HIDDEN on the back when
         180 < currentAzimuth < 360.

         We model the full rotation by animating each ellipse for the half of
         the period it's on the front, then hiding it via stroke-opacity
         during the back half. 8 longitudes at staggered phase offsets give
         the appearance of continuous Y-axis rotation. Period = 14s. -->
    <g fill="none" stroke="#FFFFFF" stroke-width="1.3" clip-path="url(#sphereClip)" mask="url(#rimMask)">

      <!-- Longitude 0 — phase 0 -->
      <ellipse cx="60" cy="60" ry="44" rx="0" stroke-opacity="0">
        <animate attributeName="rx" values="0;44;0" keyTimes="0;0.5;1" dur="7s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
        <animate attributeName="stroke-opacity" values="0.95;0.95;0;0;0.95" keyTimes="0;0.5;0.5;1;1" dur="14s" begin="0s" repeatCount="indefinite" calcMode="discrete"/>
      </ellipse>

      <!-- Longitude 1 — phase 45° -->
      <ellipse cx="60" cy="60" ry="44" rx="0" stroke-opacity="0">
        <animate attributeName="rx" values="0;44;0" keyTimes="0;0.5;1" dur="7s" begin="-1.75s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
        <animate attributeName="stroke-opacity" values="0.95;0.95;0;0;0.95" keyTimes="0;0.5;0.5;1;1" dur="14s" begin="-1.75s" repeatCount="indefinite" calcMode="discrete"/>
      </ellipse>

      <!-- Longitude 2 — phase 90° -->
      <ellipse cx="60" cy="60" ry="44" rx="0" stroke-opacity="0">
        <animate attributeName="rx" values="0;44;0" keyTimes="0;0.5;1" dur="7s" begin="-3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
        <animate attributeName="stroke-opacity" values="0.95;0.95;0;0;0.95" keyTimes="0;0.5;0.5;1;1" dur="14s" begin="-3.5s" repeatCount="indefinite" calcMode="discrete"/>
      </ellipse>

      <!-- Longitude 3 — phase 135° -->
      <ellipse cx="60" cy="60" ry="44" rx="0" stroke-opacity="0">
        <animate attributeName="rx" values="0;44;0" keyTimes="0;0.5;1" dur="7s" begin="-5.25s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
        <animate attributeName="stroke-opacity" values="0.95;0.95;0;0;0.95" keyTimes="0;0.5;0.5;1;1" dur="14s" begin="-5.25s" repeatCount="indefinite" calcMode="discrete"/>
      </ellipse>

      <!-- Longitude 4 — phase 180° (back-hemisphere half-cycle, currently hidden) -->
      <ellipse cx="60" cy="60" ry="44" rx="0" stroke-opacity="0">
        <animate attributeName="rx" values="0;44;0" keyTimes="0;0.5;1" dur="7s" begin="-7s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
        <animate attributeName="stroke-opacity" values="0.95;0.95;0;0;0.95" keyTimes="0;0.5;0.5;1;1" dur="14s" begin="-7s" repeatCount="indefinite" calcMode="discrete"/>
      </ellipse>

      <!-- Longitude 5 — phase 225° -->
      <ellipse cx="60" cy="60" ry="44" rx="0" stroke-opacity="0">
        <animate attributeName="rx" values="0;44;0" keyTimes="0;0.5;1" dur="7s" begin="-8.75s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
        <animate attributeName="stroke-opacity" values="0.95;0.95;0;0;0.95" keyTimes="0;0.5;0.5;1;1" dur="14s" begin="-8.75s" repeatCount="indefinite" calcMode="discrete"/>
      </ellipse>

      <!-- Longitude 6 — phase 270° -->
      <ellipse cx="60" cy="60" ry="44" rx="0" stroke-opacity="0">
        <animate attributeName="rx" values="0;44;0" keyTimes="0;0.5;1" dur="7s" begin="-10.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
        <animate attributeName="stroke-opacity" values="0.95;0.95;0;0;0.95" keyTimes="0;0.5;0.5;1;1" dur="14s" begin="-10.5s" repeatCount="indefinite" calcMode="discrete"/>
      </ellipse>

      <!-- Longitude 7 — phase 315° -->
      <ellipse cx="60" cy="60" ry="44" rx="0" stroke-opacity="0">
        <animate attributeName="rx" values="0;44;0" keyTimes="0;0.5;1" dur="7s" begin="-12.25s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
        <animate attributeName="stroke-opacity" values="0.95;0.95;0;0;0.95" keyTimes="0;0.5;0.5;1;1" dur="14s" begin="-12.25s" repeatCount="indefinite" calcMode="discrete"/>
      </ellipse>

    </g>

    <!-- Polar axis (static — vertical line through both poles) -->
    <line x1="60" y1="16" x2="60" y2="104" stroke="#FFFFFF" stroke-width="1.4" stroke-opacity="0.6"/>

    <!-- Specular highlight (top-left, fixed) — sells the 3D ball -->
    <ellipse cx="46" cy="40" rx="10" ry="5" fill="#FFFFFF" fill-opacity="0.28"/>
    <ellipse cx="44" cy="38" rx="4" ry="2" fill="#FFFFFF" fill-opacity="0.5"/>
  </g>

  <!-- ============== WORDMARK ============== -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="800" fill="#FFFFFF">
    <text x="130" y="65" font-size="44" letter-spacing="2">NDT</text>
    <text x="130" y="98" font-size="26" letter-spacing="1" fill-opacity="0.92">Connect</text>
  </g>
</svg>
