<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NDT Connect — free tools and marketplace for NDT inspection companies. Equipment, calibration, and certificate management. User ID only.">
  <meta name="theme-color" content="#004AAD">

  <!-- iOS Add to Home Screen support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NDT Connect">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NDT Connect</title>
  <link rel="manifest" href="manifest.json">

  <!-- Splash background while Flutter bootstraps -->
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0B1E33; }
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, #0B1E33 0%, #003680 60%, #004AAD 100%);
      color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      flex-direction: column; gap: 16px; transition: opacity 200ms;
    }
    #boot.gone { opacity: 0; pointer-events: none; }
    #boot img { width: 280px; height: auto; }
    #boot .pulse { width: 32px; height: 32px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.35); border-top-color: #FFFFFF;
      animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot">
    <img src="logo-globe-animated.svg" alt="NDT Connect"/>
    <div class="pulse"></div>
    <div style="opacity:0.7; font-size: 13px;">Loading...</div>
  </div>

  <script>
    // Hide the boot splash once Flutter mounts.
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (b) { b.classList.add('gone'); setTimeout(function(){ b.remove(); }, 250); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
